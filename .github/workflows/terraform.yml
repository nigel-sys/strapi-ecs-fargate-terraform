name: Deploy Terraform

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: true
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Decrypt tfvars
        run: |
          gpg --quiet --batch --yes \
            --decrypt --passphrase="${{ secrets.TFVARS_PASSWORD }}" \
            --output terraform/terraform.tfvars terraform/terraform.tfvars.gpg

      - name: Set docker_image dynamically
        run: |
          echo "docker_image = \"301782007642.dkr.ecr.ap-south-1.amazonaws.com/pratyush_baxla/strapi-app:${{ github.event.inputs.image_tag }}\"" \
            > terraform/dynamic.auto.tfvars

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve \
            -var-file="terraform.tfvars" \
            -var-file="dynamic.auto.tfvars"
